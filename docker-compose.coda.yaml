# Opt-in overlay that adds the Coda plugin to the dev stack, so sandbox terminals
# work locally. Pathfinder treats Coda as optional and detects it at runtime, so the
# base stack deliberately does not include it — and CI must not, or the bind-mount
# below would point at a path that does not exist on the runner.
#
# Enable it by putting this in your (gitignored) .env:
#
#     COMPOSE_FILE=docker-compose.yaml:docker-compose.coda.yaml
#     CODA_PLUGIN_DIST=../grafana-coda-app/dist
#
# after which plain `docker compose up -d --build grafana` picks it up. Or pass the
# files explicitly:
#
#     docker compose -f docker-compose.yaml -f docker-compose.coda.yaml up -d --build grafana
#
# Build the plugin in its own checkout first — `mage build:linuxARM64` (or
# build:linuxAMD64 on Intel; it must match the container arch) plus `npm run build`.
#
# This overlay mounts and provisions the plugin; it does not register it. Coda
# registration is a manual step — an admin enters an enrollment key on the Coda
# plugin's own configuration page and saves, which redeems it. Until then the
# terminal is hidden, which is the documented degraded state rather than a broken
# stack. See docs/developer/CODA.md.
services:
  grafana:
    environment:
      # The base stack already allows grafana-pathfinder-app; this must repeat it,
      # because Compose replaces scalar values rather than merging them.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-pathfinder-app,grafana-coda-app
      GF_LOG_FILTERS: plugin.grafana-pathfinder-app:debug,plugin.grafana-coda-app:debug
    volumes:
      # Point CODA_PLUGIN_DIST at a real, built dist/. There is no default: Docker
      # would create a missing path as an empty directory, Grafana would find no
      # plugin.json in it, and the provisioning entry below would then be fatal.
      - ${CODA_PLUGIN_DIST:?set CODA_PLUGIN_DIST to the Coda plugin dist/ path}:/var/lib/grafana/plugins/grafana-coda-app
      # Enables the plugin. Must travel with the mount above and never move into
      # provisioning/plugins/ — Grafana exits 1 on "plugin not installed", so this
      # entry without that mount kills the whole stack.
      - ./demo/coda-app-provisioning.yaml:/etc/grafana/provisioning/plugins/coda-app.yaml
