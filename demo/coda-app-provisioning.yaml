apiVersion: 1

# Auto-enables the Coda plugin in the dev stack. Kept out of provisioning/plugins/
# on purpose: Grafana exits 1 when a provisioned app plugin is not installed, so this
# entry is only safe alongside the bind-mount that installs it. docker-compose.coda.yaml
# mounts both, or neither.
apps:
  - type: 'grafana-coda-app'
    org_id: 1
    org_name: 'grafanalabs'
    disabled: false
