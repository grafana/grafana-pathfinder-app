name: Sync bundled tutorials

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-bundled-tutorials
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'grafana/grafana-pathfinder-app' && vars.BUNDLED_TUTORIAL_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: grafana/interactive-tutorials
          ref: main
          path: upstream-tutorials
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - name: Generate and validate bundled copies
        id: sync
        run: |
          revision=$(git -C upstream-tutorials rev-parse HEAD)
          node scripts/sync-bundled-tutorials.mjs upstream-tutorials "$revision"
          npm run validate:packages
          npm run repository:check
      - name: Create repository-scoped token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BUNDLED_TUTORIAL_SYNC_APP_ID }}
          private-key: ${{ secrets.BUNDLED_TUTORIAL_SYNC_PRIVATE_KEY }}
          owner: grafana
          repositories: grafana-pathfinder-app
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update sync PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: codex/sync-bundled-tutorials
          base: main
          sign-commits: true
          add-paths: |
            src/bundled-interactives
            src/constants/bundled-tutorials-source.json
          commit-message: 'docs: sync bundled tutorials from interactive-tutorials'
          title: 'docs: sync bundled tutorials from interactive-tutorials'
          body: |
            Updates the offline tutorial copies from [interactive-tutorials](https://github.com/grafana/interactive-tutorials/commit/${{ steps.sync.outputs.revision }}).

            Changed guides: ${{ steps.sync.outputs.changed }}.

            Package validation and repository freshness checks passed. Review and merge normally; this workflow does not auto-merge.
