# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify upstream tutorial publication
        run: node scripts/check-bundled-tutorial-publication.mjs
      - uses: grafana/plugin-actions/build-plugin@4698961fa64137fcac207108397ebe8a738a33d1
        with:
          # The action defaults to Node 20; this repo requires >=24 (.nvmrc, engines.node).
          node-version: '24'
          # Uncomment to enable plugin signing
          # (For more info on how to generate the access policy token see https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token)
          # Make sure to save the token in your repository secrets
          #policy_token: $
          # Usage of GRAFANA_API_KEY is deprecated, prefer `policy_token` option above
          #grafana_token: $
