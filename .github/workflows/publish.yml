name: Plugins - CD
run-name: Deploy ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from. Can be used to deploy PRs to dev
        default: main
      environment:
        description: Environment to publish to
        required: true
        type: choice
        options:
          - 'dev'
          - 'ops'
          - 'prod'
      docs-only:
        description: Only publish docs, do not publish the plugin
        default: false
        type: boolean

permissions: {}

env:
  # Scope for the plugin when publishing it to the catalog.
  # Choose between:
  # - 'universal': on-prem + cloud (default)
  # - 'grafana_cloud': cloud only, hidden for on-prem users
  SCOPES: universal

jobs:
  cd:
    name: CD
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v12.1.1
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      branch: ${{ github.event.inputs.branch }}
      environment: ${{ github.event.inputs.environment }}
      docs-only: ${{ fromJSON(github.event.inputs.docs-only) }}
      scopes: universal
      grafana-cloud-deployment-type: provisioned
      argo-workflow-slack-channel: '#pathfinder-app-release'
      auto-merge-environments: dev,ops
      publish-to-catalog-as-pending: false
      # temp disable while https://github.com/grafana/plugin-actions/pull/118 is being fixed
      run-playwright: false

      # TODO: add here any other CI custom inputs you may need:
      #   https://enghub.grafana-ops.net/docs/default/component/grafana-plugins-platform/plugins-ci-github-actions/010-plugins-ci-github-actions/#customizing-the-workflows-with-inputs

  # Bumps the plugin's pinned version in deployment_tools, and records its app-sdk manifest, with the
  # grafana-pathfinder-app workflow template of the appplugins-cd Argo namespace. It opens an auto-merging
  # pull request. See ksonnet/environments/appplugins-cd in grafana/deployment_tools.
  #
  # Only for releases from main to dev: the plugin version is then the one in package.json, without a
  # commit SHA suffix (see plugin-version-suffix in the CD workflow).
  update-plugin-version:
    name: Update grafana-pathfinder-app in deployment_tools
    needs: cd
    if: ${{ github.event.inputs.environment == 'dev' && github.event.inputs.branch == 'main' && !fromJSON(github.event.inputs.docs-only) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false

      - name: Get the plugin version
        id: version
        run: |
          set -e -o pipefail
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Trigger the deployment_tools workflow
        uses: grafana/shared-workflows/actions/trigger-argo-workflow@5a212d56e9d224851dc4b3c2643bbc5bac484d5d # trigger-argo-workflow/v2.0
        with:
          instance: ops
          namespace: appplugins-cd
          workflow_template: grafana-pathfinder-app
          parameters: |
            dockertag=${{ steps.version.outputs.version }}
            prCommentContext= Triggered by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
