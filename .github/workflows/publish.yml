name: Plugins - CD
run-name: Provision the published Pathfinder 2405 build in ops
on:
  workflow_dispatch:

permissions: {}

jobs:
  provision:
    name: Trigger ops frontend provisioning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: grafana/shared-workflows/actions/trigger-argo-workflow@5a212d56e9d224851dc4b3c2643bbc5bac484d5d
        with:
          namespace: grafana-plugins-cd
          workflow_template: grafana-plugins-deploy
          parameters: |
            slug=grafana-pathfinder-app
            version=2.30.0+05f7490a55cc8dda092b4bd5f556289ae4318657
            environment=ops
            slack_channel=#pathfinder-app-release
            commit=05f7490a55cc8dda092b4bd5f556289ae4318657
            commit_link=https://github.com/grafana/grafana-pathfinder-app/commit/05f7490a55cc8dda092b4bd5f556289ae4318657
            commit_timestamp=2026-11-24T10:11:40Z
            auto_merge_environments=ops
            auto_approve_durations={"ops":0}
            prod_targets_all=false
